apiVersion: apps/v1
kind: Deployment
metadata:
  name: salons
spec:
  replicas: 2
  selector:
    matchLabels:
      app: salons
  template:
    metadata:
      labels:
        app: salons
    spec:
      # Évite que Kubernetes crée une variable DB_PORT à partir du Service "db"
      enableServiceLinks: false
      containers:
        - name: salons
          image: tableau-salons:1.0
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 5000
          envFrom:
            - configMapRef:
                name: tableau-config
          env:
            - name: DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: tableau-secret
                  key: DB_PASSWORD
          readinessProbe:
            httpGet:
              path: /health
              port: 5000
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /health
              port: 5000
            initialDelaySeconds: 20
            periodSeconds: 20
            failureThreshold: 5
---
apiVersion: v1
kind: Service
metadata:
  name: salons
spec:
  selector:
    app: salons
  ports:
    - port: 5000
      targetPort: 5000
