server {
    listen 80;
    root /usr/share/nginx/html;
    index index.html;

    # Fichiers de la page web
    location / {
        try_files $uri $uri/ =404;
    }

    # Les appels de la page vers les deux API passent par nginx
    location /api/salons {
        proxy_pass http://salons:5000/salons;
    }

    location /api/traits/ {
        proxy_pass http://traits:5000/traits/;
    }
}
